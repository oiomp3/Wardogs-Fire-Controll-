<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>WARDOGS Mörser-Trainer: das Mörser-Spiel fürs Handy · Frontbuch</title>
<meta name="description" content="Mörser-Trainer für WARDOGS-Fans: Ziel auf der Karte finden, Entfernung über das 100-m-Gitter schätzen, L81 richten und treffen. Tages-Challenge, 12 Missionen, Endlos, Zeitangriff und Saisonpass – kostenlos im Browser.">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/mt/icon.svg" type="image/svg+xml">
<link rel="canonical" href="https://oiotv.de/tools/moerser-trainer/spielen/">
<link rel="manifest" href="/tools/moerser-trainer/spielen/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/mt/icon-192.png">
<meta property="og:title" content="WARDOGS Mörser-Trainer: das Mörser-Spiel fürs Handy · Frontbuch">
<meta property="og:description" content="Mörser-Trainer für WARDOGS-Fans: Ziel auf der Karte finden, Entfernung über das 100-m-Gitter schätzen, L81 richten und treffen. Tages-Challenge, 12 Missionen, Endlos, Zeitangriff und Saisonpass – kostenlos im Browser.">
<meta property="og:image" content="https://oiotv.de/assets/og/moerser-trainer.jpg">
<meta name="apple-mobile-web-app-title" content="Mörser-Trainer">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8803616523277309" crossorigin="anonymous"></script>

<link rel="stylesheet" href="/assets/mt/mt.css?v=38">
</head>
<body>
<div class="app" id="app">
  <main class="stage">
    <section class="scene-wrap" id="sceneWrap">
      <canvas id="scene" aria-label="Mortar sight view"></canvas>

      <div class="hud-tl">
        <button class="iconbtn" id="btnMenu" data-i18n-aria="menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="iconbtn" id="btnMute" data-i18n-aria="muteOn" aria-label="Mute">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path class="snd-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path class="snd-off" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="hud-tr">
        <div class="hud-mode" id="hudMode"></div>
        <div class="hud-cash" id="hudCash">$0</div>
        <div class="money"><b id="hudScore">0</b> <small data-i18n="ptsShort">PTS</small></div>
        <div class="hud-line"><span data-i18n="target">Target</span> <b id="hudRound">–</b></div>
        <div class="hud-line" id="hudStreakWrap"><span data-i18n="streak">Streak</span> <b id="hudStreak">0</b> <em class="mult" id="hudMult"></em></div>
        <div class="hud-line hud-lives" id="hudLivesWrap" hidden><span data-i18n="lives">Lives</span> <b id="hudLives"></b></div>
        <div class="hud-line hud-pb" id="hudPbWrap" hidden><span>PB</span> <b id="hudPb"></b></div>
        <div class="hud-line hud-timer" id="hudTimerWrap" hidden><span data-i18n="time">Time</span> <b id="hudTimer">60</b></div>
      </div>
      <div class="banner" id="banner" aria-live="polite"></div>
      <div class="drag-hint" id="dragHint" data-i18n="dragHint">drag to traverse · drag the RNG ladder for range</div>

      <div class="hud-bottom" id="deck">
        <div class="ctl-row">
          <div class="ctl" id="ctlDir">
            <span class="ctl-l" data-i18n="dirShort">DIR</span>
            <button class="step" data-ctl="dir" data-step="-1">«</button><button class="step" data-ctl="dir" data-step="-0.1">‹</button>
            <label class="lcd"><input id="inDir" type="text" inputmode="decimal" value="000.0" data-i18n-aria="direction" aria-label="Direction"><em>°</em></label>
            <button class="step" data-ctl="dir" data-step="0.1">›</button><button class="step" data-ctl="dir" data-step="1">»</button>
          </div>
          <div class="ctl" id="ctlRng">
            <span class="ctl-l" data-i18n="rngShort">RNG</span>
            <button class="step" data-ctl="rng" data-step="-10">«</button><button class="step" data-ctl="rng" data-step="-1">‹</button>
            <label class="lcd"><input id="inRng" type="text" inputmode="numeric" value="400" data-i18n-aria="range" aria-label="Range"><em>m</em></label>
            <button class="step" data-ctl="rng" data-step="1">›</button><button class="step" data-ctl="rng" data-step="10">»</button>
          </div>
        </div>
        <div class="corner-row">
          <button class="minimap" id="btnMap" data-i18n-aria="map" aria-label="Map">
            <canvas id="mini"></canvas>
            <span class="mini-l"><span data-i18n="map">Map</span><i>▲</i></span>
          </button>
          <div class="weapon">
            <div class="w-status" id="wpInfo"></div>
            <div class="w-name" data-i18n="weapon">L81 MORTAR</div>
            <div class="w-ammo"><b id="ammoCount">003</b><span class="shell" aria-hidden="true"></span></div>
          </div>
          <button class="btn-fire" id="btnFire"><span class="fire-ring"></span><span data-i18n="fire">FIRE</span></button>
        </div>
      </div>
    </section>
  </main>

  <!-- Taktik-Tablet -->
  <div class="tablet-layer" id="tabletLayer" hidden>
    <div class="tablet" id="tablet">
      <div class="tab-bar">
        <span class="tab-led"></span><span class="tab-title" data-i18n="tabletTitle">TAK-TABLET</span>
        <span class="tab-grid" data-i18n="grid100">Gitter 100 m</span>
        <span class="tab-clock" id="tabClock">--:--</span>
        <button class="tab-x" id="btnTabClose" data-i18n-aria="close" aria-label="Close">✕</button>
      </div>
      <div class="tab-screen" id="tabScreen">
        <canvas id="map"></canvas>
        <div class="scan"></div>
        <div class="map-hint" id="mapHint"></div>
        <div class="map-zoom">
          <button id="zIn" aria-label="Zoom +">+</button><button id="zOut" aria-label="Zoom −">−</button><button id="zMe" data-i18n-aria="ownPos" aria-label="Own position">◎</button>
        </div>
        <div class="result" id="resultCard" hidden></div>
      </div>
      <div class="tab-foot" id="tabFoot">
        <div class="foot-btns">
          <button class="btn-ghost" id="btnClearMarker" data-i18n="clearMarker">Clear</button>
          <button class="btn-go" id="btnApply" data-i18n="applyMarker">Use marker</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Home / screens -->
  <div class="overlay ov-home" id="ovHome" hidden>
    <div class="home-panel" id="homePanel"></div>
  </div>

  <!-- Mission briefing -->
  <div class="overlay ov-brief" id="ovBrief" hidden>
    <div class="panel brief-panel" id="briefPanel"></div>
  </div>

  <!-- Anleitung -->
  <div class="overlay ov-tut" id="ovTut" hidden>
    <div class="panel tut-panel">
      <div class="tut-ill" id="tutIll"></div>
      <div class="tut-step" id="tutStep">1/4</div>
      <h2 id="tutTitle"></h2>
      <p id="tutText"></p>
      <p class="fine keys" data-i18n="keys"></p>
      <div class="tut-dots" id="tutDots"></div>
      <div class="tut-btns"><button class="btn-ghost" id="tutPrev" data-i18n="prev">Back</button><button class="btn-go" id="tutNext" data-i18n="next">Next</button></div>
    </div>
  </div>

  <!-- Menü -->
  <div class="overlay ov-menu" id="ovMenu" hidden>
    <div class="panel menu-panel">
      <h2 data-i18n="paused">Pause</h2>
      <button class="btn-big" id="mResume" data-i18n="resume">Next</button>
      <button class="btn-ghost wide" id="mSettings" data-i18n="settings">Settings</button>
      <button class="btn-ghost wide" id="mHowto" data-i18n="howto">Kurzanleitung</button>
      <button class="btn-ghost wide" id="mRestart" data-i18n="restart">Neu starten</button>
      <button class="btn-ghost wide" id="mMain" data-i18n="mainMenu">Main menu</button>
    </div>
  </div>

  <!-- Auswertung -->
  <div class="overlay ov-end" id="ovEnd" hidden>
    <div class="panel end-panel" id="endPanel"></div>
  </div>
  <!-- Level-up -->
  <div class="overlay ov-level" id="ovLevel" hidden>
    <div class="panel level-panel" id="levelPanel"></div>
  </div>
  <!-- Settings (in-game) -->
  <div class="overlay ov-settings" id="ovSettings" hidden>
    <div class="panel settings-panel" id="settingsPanel"></div>
  </div>
  <!-- Crate opening -->
  <div class="overlay ov-crate" id="ovCrate" hidden>
    <div class="panel open-panel"><div class="open-stage" id="crateStage"></div><div id="crateDrop"></div>
      <div id="crateOk" class="end-btns" hidden><button class="btn-big" id="crateEquip" data-i18n="equip">Equip</button><button class="btn-ghost wide" id="crateKeep" data-i18n="close">Close</button></div>
    </div>
  </div>
  <div class="stamp" id="stamp"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="fx" id="fx" aria-live="polite"></div>
  <div class="rotate-hint" id="rotateHint"><svg viewBox="0 0 48 48" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2"><rect x="15" y="6" width="18" height="34" rx="3"/><path d="M8 30a16 16 0 0 0 10 12M40 18A16 16 0 0 0 30 6"/><path d="M18 42l0-4 4 0M30 6l0 4-4 0"/></svg><b data-i18n="rotate">Rotate your phone</b><span data-i18n="rotateSub">Mortar Trainer is played in portrait.</span></div>
</div>
<script>window.adsbygoogle=window.adsbygoogle||[];window.adBreak=window.adConfig=function(o){adsbygoogle.push(o)};window.MT_MONETIZE={ads:true,rewarded:true,h5:true};</script>
<script>window.MT_LANG="de";window.MT_BACK="/tools/moerser-trainer/";</script>

</body>
</html>
